<!doctype html><html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniVault • Cover Pages</title>
<link rel="stylesheet" href="../assets/css/styles.css"/></head><body>
<div id="topProgress" aria-hidden="true"></div><div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<header class="nav"><div class="container nav-inner">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>UniVault</span></div>
  <nav class="nav-links">
    <a href="../index.html">Home</a>
    <a href="../library.html">Resources</a>
    <a href="cover.html" class="active">Cover Pages</a>
    <a href="timetables.html">Timetables</a>
    <a href="lecturers.html">Lecturers</a>
    <button class="btn" id="themeBtn" type="button">Dark mode</button>
  </nav>
</div></header>
<main class="container" style="padding:18px 0">
  <h2 class="section-title">Cover Page Generator</h2>
  <p class="section-sub">Fill details, then print/save.</p>
  <div class="grid-2" style="margin-top:12px">
    <form id="coverForm" class="card box no-print">
      <div style="display:grid; gap:10px">
        <input class="select" id="institution" style="padding:12px" placeholder="Institution"/>
        <input class="select" id="department" style="padding:12px" placeholder="Department / School"/>
        <input class="select" id="programme" style="padding:12px" placeholder="Programme"/>
        <div style="display:grid; grid-template-columns:1fr 140px; gap:10px">
          <input class="select" id="course" style="padding:12px" placeholder="Course name"/>
          <input class="select" id="code" style="padding:12px" placeholder="Code"/>
        </div>
        <input class="select" id="title" style="padding:12px" placeholder="Assignment title"/>
        <input class="select" id="lecturer" style="padding:12px" placeholder="Lecturer"/>
        <input class="select" id="date" style="padding:12px" placeholder="Date"/>
        <div class="notice">
          <label style="margin-right:14px"><input type="radio" name="mode" value="individual" checked/> Individual</label>
          <label><input type="radio" name="mode" value="group"/> Group</label>
        </div>
        <div id="groupWrap" style="display:none">
          <div id="members"></div>
          <button class="btn" id="addMember" type="button" style="margin-top:10px">Add Member</button>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <input class="select" id="name" style="padding:12px" placeholder="Name"/>
          <input class="select" id="reg" style="padding:12px" placeholder="Reg. No"/>
        </div>
        <button class="btn primary" id="printCover" type="button">Print / Save</button>
      </div>
    </form>
    <div id="coverPreview" class="no-print"></div>
  </div>
</main>
<button id="backToTop" class="fab" type="button" aria-label="Back to top">↑</button>
<script src="../assets/js/app.js"></script>
</body></html>
